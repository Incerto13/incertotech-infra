# Deploy an environment to the k3s cluster: pick staging or prod from the
# dropdown (defaults to staging). Prod only runs from main, and runs in the
# GitHub Environment "production" (add required reviewers there for an approval
# click before each prod deploy). Each environment has its own concurrency lock.
#
# How it works — no AWS keys, no SSH key, no kubeconfig in GitHub:
#   1. build + push every app image from its repo's env branch (staging ->
#      staging, prod -> main) with an immutable <env>-<sha> tag, and pin the
#      overlay to those tags (bin/k8s-build-images.sh)
#   2. assume the incertotech-github-deploy IAM role via GitHub OIDC
#   3. decrypt k8s/overlays/<env>/secrets/*.enc.env with SOPS (age key from the
#      SOPS_AGE_KEY secret), render k8s/base/traefik-cloud + the overlay
#   4. upload the rendered manifest to the deploy-artifacts S3 bucket
#   5. ask SSM Run Command to execute `incertotech-deploy <s3 uri>` on the
#      node, which applies it and waits for the rollout
#
# The deploy role ARN is fixed (created by terraform/shared), and the k3s
# instance + artifacts bucket are looked up at run time by their
# terraform-managed name/tag. Repository secrets:
#   SOPS_AGE_KEY = contents of ~/.config/sops/age/incertotech-keys.txt
#   DOCKER_USERNAME / DOCKER_PASSWORD = Docker Hub push credentials (incerto13)
# The rendered manifest contains the decrypted Secrets, so it is deleted from S3
# right after the apply (and the bucket expires old object versions).
name: "K8s: Deploy"
run-name: "K8s deploy → ${{ inputs.env }} (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to deploy"
        type: choice
        required: true
        default: staging
        options: [staging, prod]

permissions:
  id-token: write   # OIDC token for AssumeRoleWithWebIdentity
  contents: read

concurrency:
  group: k8s-deploy-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Prod deploys only from main
        if: inputs.env == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Prod deploys must run from main (got ${{ github.ref_name }})."
          exit 1

      - uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::249107242695:role/incertotech-github-deploy
          aws-region: us-east-1

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.5.0
          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/ && rm kustomize.tar.gz
          kustomize version

      - name: Find the k3s node and artifacts bucket
        id: target
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=incertotech-k3s Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$instance_id" ] || [ "$instance_id" = "None" ]; then
            echo "::error::No running EC2 instance tagged Name=incertotech-k3s (terraform/shared applied?)"; exit 1
          fi
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "bucket=incertotech-deploy-artifacts-${account}" >> "$GITHUB_OUTPUT"
          echo "k3s node: $instance_id"

      - name: Install SOPS
        run: |
          SOPS_VERSION=3.11.0
          for i in 1 2 3; do
            curl -fsSL -o sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" && break
            echo "sops download retry $i failed"; sleep 5
          done
          chmod +x sops && sudo mv sops /usr/local/bin/ && sops --version

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          for enc in k8s/overlays/${{ inputs.env }}/secrets/*.enc.env; do
            sops decrypt --input-type dotenv --output-type dotenv "$enc" > "${enc%.enc.env}.env"
          done
          ls k8s/overlays/${{ inputs.env }}/secrets/

      - name: Build and push images
        # also pins k8s/overlays/<env>/kustomization.yaml (this checkout only)
        # to the tags it just pushed, which the next step renders
        run: bin/k8s-build-images.sh "${{ inputs.env }}" "$RUNNER_TEMP/apps"

      - name: Render manifests
        run: |
          # Two manifests, applied in order: Traefik (incl. its CRDs) first, then the
          # apps. Applied together on a fresh cluster, the IngressRoutes/Middlewares
          # are rejected before the CRDs are registered ("ensure CRDs are installed
          # first"), which failed the very first staging deploys.
          kustomize build k8s/base/traefik-cloud > traefik.yaml
          kustomize build "k8s/overlays/${{ inputs.env }}" > rendered.yaml
          echo "rendered $(grep -c '^kind:' traefik.yaml) traefik + $(grep -c '^kind:' rendered.yaml) app objects"

      - name: Upload to S3
        id: upload
        run: |
          prefix="s3://${{ steps.target.outputs.bucket }}/${{ inputs.env }}/${GITHUB_SHA}-${GITHUB_RUN_ID}"
          aws s3 cp traefik.yaml "${prefix}-traefik.yaml"
          aws s3 cp rendered.yaml "${prefix}.yaml"
          echo "traefik_uri=${prefix}-traefik.yaml" >> "$GITHUB_OUTPUT"
          echo "uri=${prefix}.yaml" >> "$GITHUB_OUTPUT"

      - name: Apply on the node via SSM
        env:
          MANIFEST_URI: ${{ steps.upload.outputs.uri }}
          TRAEFIK_URI: ${{ steps.upload.outputs.traefik_uri }}
          NAMESPACE: incertotech-${{ inputs.env }}
        run: |
          # Apply the rendered manifest on the node and wait for the rollout.
          python3 - <<'PY'
          import json, os
          manifest, traefik = os.environ["MANIFEST_URI"], os.environ["TRAEFIK_URI"]
          ns = os.environ["NAMESPACE"]
          # incertotech-deploy waits with ONE 300s deadline for all deployments
          # in order, so a single stuck one makes every later one report "timed
          # out". On failure, print what is actually wrong: the pods that are
          # not fully ready, and the namespace's recent warnings.
          diagnose = (
              f"{{ echo '::group::not-ready pods in {ns}'; "
              f"kubectl -n {ns} get pods --no-headers | awk '{{split($2,r,\"/\"); if (r[1]!=r[2] || $3!=\"Running\") print}}'; "
              f"echo '::endgroup::'; echo '::group::recent warnings in {ns}'; "
              f"kubectl -n {ns} get events --field-selector type=Warning --sort-by=.lastTimestamp | tail -20; "
              f"echo '::endgroup::'; exit 1; }}"
          )
          commands = [
              "set -e",
              "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
              f"/usr/local/bin/incertotech-deploy {traefik}",
              "kubectl wait --for=condition=Established crd --all --timeout=60s",
              f"/usr/local/bin/incertotech-deploy {manifest} || {diagnose}",
          ]
          json.dump({"commands": commands, "executionTimeout": ["900"]}, open("ssm-params.json", "w"))
          PY
          cmd_id=$(aws ssm send-command \
            --instance-ids "${{ steps.target.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "k8s-deploy ${{ inputs.env }} ${GITHUB_SHA::7}" \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $cmd_id"
          # poll until the command finishes, then surface its output
          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "${{ steps.target.outputs.instance_id }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Pending|InProgress|Delayed) sleep 10 ;;
              *) echo "SSM status: $status"; break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$cmd_id" \
            --instance-id "${{ steps.target.outputs.instance_id }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["Stdout"]); print(d["Stderr"], file=sys.stderr); sys.exit(0 if d["Status"]=="Success" else 1)'

      - name: Remove decrypted secrets
        if: always()
        run: |
          find k8s/overlays/${{ inputs.env }}/secrets -name '*.env' ! -name '*.enc.env' -exec shred -u {} +
          rm -f rendered.yaml traefik.yaml
          if [ -n "${{ steps.upload.outputs.uri }}" ]; then
            aws s3 rm "${{ steps.upload.outputs.uri }}"
            aws s3 rm "${{ steps.upload.outputs.traefik_uri }}"
          fi

