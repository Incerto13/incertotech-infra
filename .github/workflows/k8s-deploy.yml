# Deploy an environment to the k3s cluster: pick staging or prod from the
# dropdown (defaults to staging). Prod only runs from main, and runs in the
# GitHub Environment "production" (add required reviewers there for an approval
# click before each prod deploy). Each environment has its own concurrency lock.
#
# How it works — no AWS keys, no SSH key, no kubeconfig in GitHub:
#   1. assume the incertotech-github-deploy IAM role via GitHub OIDC
#   2. render k8s/base/traefik-cloud + k8s/overlays/<env> with kustomize
#   3. upload the rendered manifest to the deploy-artifacts S3 bucket
#   4. ask SSM Run Command to execute `incertotech-deploy <s3 uri>` on the
#      node, which applies it and waits for the rollout
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables),
# all from `terraform -chdir=terraform/shared output`:
#   AWS_ROLE_ARN      github_deploy_role_arn
#   DEPLOY_BUCKET     artifacts_bucket
#   K3S_INSTANCE_ID   instance_id
name: "K8s: Deploy"
run-name: "K8s deploy → ${{ inputs.env }} (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to deploy"
        type: choice
        required: true
        default: staging
        options: [staging, prod]

permissions:
  id-token: write   # OIDC token for AssumeRoleWithWebIdentity
  contents: read

concurrency:
  group: k8s-deploy-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Prod deploys only from main
        if: inputs.env == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Prod deploys must run from main (got ${{ github.ref_name }})."
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.5.0
          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/ && rm kustomize.tar.gz
          kustomize version

      - name: Render manifests
        run: |
          {
            kustomize build k8s/base/traefik-cloud
            echo "---"
            kustomize build "k8s/overlays/${{ inputs.env }}"
          } > rendered.yaml
          echo "rendered $(grep -c '^kind:' rendered.yaml) objects"

      - name: Upload to S3
        id: upload
        run: |
          prefix="s3://${{ vars.DEPLOY_BUCKET }}/${{ inputs.env }}/${GITHUB_SHA}-${GITHUB_RUN_ID}"
          aws s3 cp rendered.yaml "${prefix}.yaml"
          aws s3 cp k8s/ensure-secrets.sh "${prefix}-ensure-secrets.sh"
          echo "uri=${prefix}.yaml" >> "$GITHUB_OUTPUT"
          echo "secrets_uri=${prefix}-ensure-secrets.sh" >> "$GITHUB_OUTPUT"

      - name: Apply on the node via SSM
        env:
          NAMESPACE: incertotech-${{ inputs.env }}
          MANIFEST_URI: ${{ steps.upload.outputs.uri }}
          SECRETS_URI: ${{ steps.upload.outputs.secrets_uri }}
        run: |
          # 1) create the app secrets in the namespace if missing (random values,
          #    created once on the node, never in git), 2) apply + wait for rollout.
          python3 - <<'PY'
          import json, os
          ns, manifest, script = os.environ["NAMESPACE"], os.environ["MANIFEST_URI"], os.environ["SECRETS_URI"]
          commands = [
              "set -e",
              "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
              f"aws s3 cp {script} /tmp/ensure-secrets.sh",
              f"sh /tmp/ensure-secrets.sh {ns}",
              f"/usr/local/bin/incertotech-deploy {manifest}",
          ]
          json.dump({"commands": commands, "executionTimeout": ["900"]}, open("ssm-params.json", "w"))
          PY
          cmd_id=$(aws ssm send-command \
            --instance-ids "${{ vars.K3S_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "k8s-deploy ${{ inputs.env }} ${GITHUB_SHA::7}" \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $cmd_id"
          # poll until the command finishes, then surface its output
          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "${{ vars.K3S_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Pending|InProgress|Delayed) sleep 10 ;;
              *) echo "SSM status: $status"; break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$cmd_id" \
            --instance-id "${{ vars.K3S_INSTANCE_ID }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["Stdout"]); print(d["Stderr"], file=sys.stderr); sys.exit(0 if d["Status"]=="Success" else 1)'
