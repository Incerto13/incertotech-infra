# react-electoral-map — static React build served by nginx. No backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-electoral-map
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-electoral-map
  template:
    metadata:
      labels:
        app: react-electoral-map
    spec:
      containers:
      - name: react-electoral-map
        image: react-electoral-map
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: react-electoral-map
spec:
  selector:
    app: react-electoral-map
  ports:
  - port: 80
    targetPort: 80
